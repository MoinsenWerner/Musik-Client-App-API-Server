<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benachrichtigung hinzufügen</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { margin: 0; background: #111827; color: #e5e7eb; }
        main { width: min(700px, calc(100% - 2rem)); margin: 3rem auto; }
        form { display: grid; gap: 1rem; padding: 1.5rem; background: #1f2937; border: 1px solid #374151; border-radius: .75rem; }
        label { display: grid; gap: .35rem; font-weight: 600; }
        input { padding: .75rem; border: 1px solid #4b5563; border-radius: .45rem; background: #111827; color: #f9fafb; }
        button { padding: .8rem; border: 0; border-radius: .45rem; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
        .error { padding: .8rem; border-radius: .45rem; background: #7f1d1d; }
        nav { display: flex; gap: 1rem; margin-bottom: 1rem; }
        a { color: #93c5fd; }
    </style>
</head>
<body>
    <main>
        <h1>Benachrichtigung hinzufügen</h1>
        <nav><a href="/notify/edit">Benachrichtigungen bearbeiten</a><a href="/routes">Routenübersicht</a></nav>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            <label>Titel *<input name="title" required value="{{ values.get('title', '') if values else '' }}"></label>
            <label>Text *<input name="text" required value="{{ values.get('text', '') if values else '' }}"></label>
            <label>Categorie *<input name="category" required value="{{ values.get('category', '') if values else '' }}"></label>
            <label>Gruppe *<input name="notification_group" required value="{{ values.get('notification_group', '') if values else '' }}"></label>
            <label>Png-Pfad<input name="png_path" value="{{ values.get('png_path', '') if values else '' }}"></label>
            <button type="submit">Send Notification</button>
        </form>
    </main>
</body>
</html>
